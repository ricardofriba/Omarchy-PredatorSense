name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - run: bash -n status.sh system/omarchy-predatorsense-ph31552-helper packaging/facer/PKGBUILD packaging/helper/PKGBUILD
      - run: python3 -m json.tool manifest.json > /dev/null
